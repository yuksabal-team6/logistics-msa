# 테스트 전용: 인메모리 H2(PostgreSQL 모드), Eureka 미사용
spring:
  datasource:
    # Hibernate default_schema(company_service)를 연결할 때 미리 만든다
    url: jdbc:h2:mem:company_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS company_service
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # schema.sql의 부분 유니크 인덱스(WHERE 조건)는 H2가 지원하지 않아 실행하지 않는다
  # → 사업자 등록번호·관리자 중복의 DB 최종 방어(동시 요청 409)는 H2 테스트로 확인할 수 없다
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false
