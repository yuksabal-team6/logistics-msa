server:
  port: 8084

spring:
  application:
    name: order-service
  config:
    import: optional:classpath:application-secret.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistics}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  # schema.sql: 엔티티로 표현할 수 없는 부분 유니크 인덱스 (결정 15, 18)
  sql:
    init:
      mode: always
      encoding: UTF-8  # SQL 파일을 OS 기본 인코딩이 아닌 UTF-8로 읽는다
  jpa:
    # Hibernate가 테이블을 만든 뒤 schema.sql 실행
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        default_schema: order_service
        hbm2ddl:
          create_namespaces: true
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    show-sql: false
  # Slack 알림 이벤트 (#198). 컨테이너에서는 kafka:9092, 로컬 실행은 localhost:29092
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      # producer가 OrderOutboxPublisher의 발행 대기(10초)보다 먼저 포기하게 함
      #  기본값(전송 제한 2분)이면 우리가 "실패"로 보고 다시 보낸 뒤에도 producer가 버퍼에 남은 메시지를 늦게 보내 중복 발행됨
      properties:
        max.block.ms: 5000
        request.timeout.ms: 4000
        delivery.timeout.ms: 5000
    consumer:
      group-id: order-slack-notifier
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.yuksabal.order.*
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
            logger-level: basic

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:}
  # 수동 처리, 확인 필요 알림 (#order-admin-noti). 비면 webhook-url로 보냄
  admin-webhook-url: ${SLACK_ADMIN_WEBHOOK_URL:}

# 주문 이벤트 outbox 발행 (#198). 안 보낸 이벤트를 poll-interval-ms마다 Kafka로 발행
order:
  outbox:
    enabled: ${ORDER_OUTBOX_ENABLED:true}
    poll-interval-ms: ${ORDER_OUTBOX_POLL_INTERVAL_MS:1000}
    # 한 회차에 보낼 최대 건수
    batch-size: ${ORDER_OUTBOX_BATCH_SIZE:100}

# order 로그 레벨. 기본 INFO(주문 결과만), 단계별 로그를 보려면 ORDER_LOG_LEVEL=DEBUG
logging:
  level:
    com.yuksabal.order: ${ORDER_LOG_LEVEL:INFO}
