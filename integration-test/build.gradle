// 전체 서비스 통합 테스트 (#167). docker-compose로 모든 서비스를 띄운 뒤 게이트웨이(8080)로 실제 요청을 보낸다
// 서비스가 떠 있어야 통과하므로 평소 build·test에서는 실행하지 않고, integrationTest 태스크로만 실행한다
//   ./gradlew build -x test
//   docker compose -f docker-compose.yml -f docker-compose.it.yml up -d --build
//   ./gradlew :integration-test:integrationTest
bootJar {
	enabled = false
}

dependencies {
	testImplementation 'com.fasterxml.jackson.core:jackson-databind'
	testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

// 기본 test는 끈다 (컴파일은 build에서 계속 확인된다)
tasks.named('test') {
	enabled = false
}

tasks.register('integrationTest', Test) {
	description = '전체 서비스를 띄운 상태에서 게이트웨이로 시나리오를 실행한다'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	// 서비스 상태에 따라 결과가 달라지므로 매번 실행한다
	outputs.upToDateWhen { false }
	// -Dit.baseUrl=..., -Dit.masterUsername=... 로 바꿀 수 있다
	systemProperties System.getProperties().findAll { it.key.toString().startsWith('it.') }
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}
