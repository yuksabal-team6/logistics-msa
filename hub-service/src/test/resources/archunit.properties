# ArchUnit 동결(FreezingArchRule) 기록 설정
# 기존 위반을 이 경로에 기록하고, 이후에는 기록에 없는 새 위반만 실패시킨다. 기록 파일은 커밋한다
freeze.store.default.path=src/test/resources/archunit_store
# 기록 파일이 없을 때 새로 만들지 않는다. 기록을 처음 만들 때만 true로 바꿔 생성·검토한 뒤 false로 되돌린다
# (false여야 기록 파일이 지워지거나 규칙이 추가돼도 새 위반이 몰래 기준선이 되지 않는다)
freeze.store.default.allowStoreCreation=false
# 해결된 위반을 기록에서 지운다. 새 위반을 기록에 추가하지는 않는다 (freeze.refreeze는 쓰지 않는다)
freeze.store.default.allowStoreUpdate=true
