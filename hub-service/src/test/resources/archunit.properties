# ArchUnit 동결(FreezingArchRule) 기록 설정
# 기존 위반을 이 경로에 기록하고, 이후에는 기록에 없는 새 위반만 실패시킨다. 기록 파일은 커밋한다
freeze.store.default.path=src/test/resources/archunit_store
# 기록 저장소(stored.rules)가 없을 때 새로 만들지 않는다. 처음 만들 때만 true로 바꿔 생성·검토한 뒤 false로 되돌린다
# 저장소가 이미 있으면 새 규칙 항목은 이 설정이 아니라 아래 allowStoreUpdate가 막는다
freeze.store.default.allowStoreCreation=false
# 기록을 자동으로 바꾸지 않는다. true면 새 동결 규칙을 추가하거나 규칙 설명(as)을 바꿀 때 그때의 위반이 몰래 기준선이 되고 통과한다
# 대신 위반을 고치면(DTO 분리 등) 기록과 달라져 실패하므로, 그때만 true로 바꿔 실행하고
# 기록 diff에 지워진 줄만 있는지 검토한 뒤 false로 되돌려 기록과 함께 커밋한다 (freeze.refreeze는 쓰지 않는다)
freeze.store.default.allowStoreUpdate=false
