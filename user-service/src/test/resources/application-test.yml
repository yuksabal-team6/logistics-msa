# 통합 테스트 전용: 인메모리 H2(PostgreSQL 모드), Eureka 미사용
spring:
  datasource:
    url: jdbc:h2:mem:user_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # schema.sql의 부분 유니크 인덱스(WHERE 조건)는 H2가 지원하지 않아 실행하지 않는다
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false

# 개발 PC에 INITIAL_MASTER_* 환경변수가 있어도 테스트 데이터가 섞이지 않게 비운다 (필요한 테스트만 따로 설정)
initial-master:
  username: ""
  password: ""
  email: ""
  slack-id: ""
