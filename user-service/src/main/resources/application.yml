server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: optional:classpath:application-secret.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistics}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  # schema.sql: 엔티티로 표현할 수 없는 부분 유니크 인덱스 (결정 #15)
  sql:
    init:
      mode: always
      encoding: UTF-8  # SQL 파일을 OS 기본 인코딩이 아닌 UTF-8로 읽는다
  jpa:
    # Hibernate가 테이블을 만든 뒤에 schema.sql 실행
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        default_schema: user_service
        hbm2ddl:
          create_namespaces: true
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    show-sql: false
  # 내부 API 호출 제한 시간 (order·delivery와 같은 값). 넘기면 502 DEPENDENCY_FAILURE
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
            logger-level: basic

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 3600000
  # Refresh Token 유효 기간 7일 (ms). DB p_refresh_tokens에 해시로 저장, 재발급 시 rotation
  refresh-token:
    expiration: 604800000

# 최초 MASTER 계정: 4개가 모두 있을 때만 생성, MASTER가 이미 있으면 건너뜀 (InitialMasterInitializer)
# 실제 값은 환경변수(.env) 또는 application-secret.yml로만 넣는다. 비워 두면 생성하지 않고 정상 기동한다.
initial-master:
  username: ${INITIAL_MASTER_USERNAME:}
  password: ${INITIAL_MASTER_PASSWORD:}
  email: ${INITIAL_MASTER_EMAIL:}
  slack-id: ${INITIAL_MASTER_SLACK_ID:}
