# 로컬 IDE 실행 전용: IntelliJ Run Configuration → Active profiles: local
# 같은 PC에서만 접속되게 loopback에만 바인딩한다. 외부 요청은 게이트웨이(8080)로만 받는다.
# 같은 PC의 게이트웨이·Swagger·Postman에서는 그대로 호출되고, 같은 네트워크의 다른 PC에서 8081 직접 호출(X-User-Id 위조)은 막힌다.
# Docker는 이 프로필을 쓰지 않는다 (컨테이너는 서비스 포트를 외부에 열지 않는다).
server:
  address: 127.0.0.1

eureka:
  instance:
    # 게이트웨이가 LAN IP로 찾아와 연결에 실패하지 않도록 등록 주소도 loopback으로 맞춘다
    ip-address: 127.0.0.1
