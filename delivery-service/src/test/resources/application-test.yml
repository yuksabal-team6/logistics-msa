# 테스트 전용: Eureka 미사용. DB 접속 정보는 IntegrationTestSupport가 PostgreSQL 컨테이너로 넣는다
# 개발 DB(localhost:5432)에 붙지 않도록 기본 URL도 쓸 수 없는 값으로 덮는다 (컨테이너 값이 다시 덮는다)
spring:
  datasource:
    url: jdbc:postgresql://must-be-overridden-by-testcontainers:1/none
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false
