server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:classpath:application-secret.yml
  cloud:
    gateway:
      mvc:
        routes:
          - id: user-service
            uri: lb://user-service
            predicates:
              - Path=/api/v1/auth/**,/api/v1/users/**
          - id: hub-service
            uri: lb://hub-service
            predicates:
              - Path=/api/v1/hubs/**,/api/v1/hub-routes/**
          - id: company-service
            uri: lb://company-service
            predicates:
              - Path=/api/v1/companies/**,/api/v1/products/**
          - id: order-service
            uri: lb://order-service
            predicates:
              - Path=/api/v1/orders/**
          - id: delivery-service
            uri: lb://delivery-service
            predicates:
              - Path=/api/v1/deliveries/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:}
