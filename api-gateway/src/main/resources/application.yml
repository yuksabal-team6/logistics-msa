server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:classpath:application-secret.yml
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: hub-service
          uri: lb://hub-service
          predicates:
            - Path=/api/v1/hubs/**,/api/v1/hub-routes/**,/api/v1/inventories/**
        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/api/v1/companies/**,/api/v1/products/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/api/v1/deliveries/**

        # 통합 Swagger용: /{서비스}/v3/api-docs → 각 서비스의 /v3/api-docs
        - id: user-service-api-docs
          uri: lb://user-service
          predicates:
            - Path=/user-service/v3/api-docs
          filters:
            - StripPrefix=1
        - id: hub-service-api-docs
          uri: lb://hub-service
          predicates:
            - Path=/hub-service/v3/api-docs
          filters:
            - StripPrefix=1
        - id: company-service-api-docs
          uri: lb://company-service
          predicates:
            - Path=/company-service/v3/api-docs
          filters:
            - StripPrefix=1
        - id: order-service-api-docs
          uri: lb://order-service
          predicates:
            - Path=/order-service/v3/api-docs
          filters:
            - StripPrefix=1
        - id: delivery-service-api-docs
          uri: lb://delivery-service
          predicates:
            - Path=/delivery-service/v3/api-docs
          filters:
            - StripPrefix=1

# 통합 Swagger UI: http://localhost:8080/swagger-ui/index.html (오른쪽 위 드롭다운으로 서비스 선택)
springdoc:
  # WebFlux springdoc은 기본적으로 /webjars/swagger-ui/** 에서 UI를 제공한다. 빈 값으로 두어 PROJECT_SETUP의 주소와 맞춘다
  webjars:
    prefix: ""
  swagger-ui:
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: hub-service
        url: /hub-service/v3/api-docs
      - name: company-service
        url: /company-service/v3/api-docs
      - name: order-service
        url: /order-service/v3/api-docs
      - name: delivery-service
        url: /delivery-service/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:}

# 인증 제외 경로 (메서드 + 경로 패턴). 여기에 없는 모든 요청은 JWT 필수
auth:
  public-paths:
    - method: POST
      path: /api/v1/auth/register
    - method: POST
      path: /api/v1/auth/login
    # 통합 Swagger (PROJECT_SETUP TODO)
    - method: GET
      path: /swagger-ui/**
    - method: GET
      path: /v3/api-docs/**
    - method: GET
      path: /*-service/v3/api-docs
  # API별 역할 제한 (1단계). 위에서부터 처음 맞는 규칙 하나만 적용, 맞는 규칙이 없으면 인증만 확인한다.
  # 서비스도 담당자·소유자·DB 역할을 다시 확인한다 (2단계). 다른 서비스 경로는 담당자별 권한 표를 모아 한 PR로 추가
  # 경로 패턴의 *는 경로 한 칸(예: 회원 ID), **는 그 아래 전부
  # 순서: 구체적인 경로를 위에, 넓은 패턴(/**)은 아래에 둔다 (넓은 패턴이 위에 있으면 아래 규칙이 적용되지 않는다)
  role-rules:
    # user-service 회원 관리 (MASTER 전용). 상세 GET /api/v1/users/{userId}는 본인도 조회하므로 넣지 않는다
    - method: GET
      path: /api/v1/users
      roles: [MASTER]
    - method: PATCH
      path: /api/v1/users/*
      roles: [MASTER]
    - method: PATCH
      path: /api/v1/users/*/role
      roles: [MASTER]
    - method: PATCH
      path: /api/v1/users/*/status
      roles: [MASTER]
    - method: DELETE
      path: /api/v1/users/*
      roles: [MASTER]

    # company-service 업체·상품. 조회(GET)는 로그인만, 본인 업체인지는 서비스가 확인한다
    - method: POST
      path: /api/v1/companies
      roles: [MASTER, COMPANY]
    - method: PATCH
      path: /api/v1/companies/*
      roles: [MASTER, COMPANY]
    - method: DELETE
      path: /api/v1/companies/*
      roles: [MASTER]
    - method: POST
      path: /api/v1/companies/*/products
      roles: [MASTER, COMPANY]
    - method: PATCH
      path: /api/v1/products/*
      roles: [MASTER, COMPANY]
    - method: DELETE
      path: /api/v1/products/*
      roles: [MASTER, COMPANY]

    # order-service. 주문 삭제만 MASTER 전용
    - method: DELETE
      path: /api/v1/orders/*
      roles: [MASTER]

    # delivery-service. 담당 배송인지는 서비스가 확인한다
    - method: PATCH
      path: /api/v1/deliveries/*/status
      roles: [MASTER, DELIVERY]
    - method: PATCH
      path: /api/v1/deliveries/*/routes/*/status
      roles: [MASTER, DELIVERY]
    - method: PATCH
      path: /api/v1/deliveries/*/manager
      roles: [MASTER]
    - method: PATCH
      path: /api/v1/deliveries/*/routes/*/manager
      roles: [MASTER]
    - method: DELETE
      path: /api/v1/deliveries/*
      roles: [MASTER]

    # hub-service 재고. 허브·경로 조회는 로그인만. 재고 생성은 입고(inbound)가 같이 처리한다 (재고가 없으면 새로 만든다)
    - method: GET
      path: /api/v1/inventories
      roles: [MASTER]
    - method: GET
      path: /api/v1/inventories/*
      roles: [MASTER]
    - method: GET
      path: /api/v1/inventories/hubs/*
      roles: [MASTER]
    - method: GET
      path: /api/v1/inventories/products/*
      roles: [MASTER, COMPANY]
    - method: POST
      path: /api/v1/inventories/inbound
      roles: [MASTER]
    - method: PATCH
      path: /api/v1/inventories/*
      roles: [MASTER]
